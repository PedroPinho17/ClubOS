# Infra local (Postgres, Redis, Garage S3).
# Portas só em 127.0.0.1 — não expor à rede/LAN.
# Passwords: definir no .env (ver .env.example). Defaults abaixo são só para dev local.

services:
  postgres:
    image: postgres:16-alpine
    container_name: clubos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clubos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-clubos}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clubos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clubos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clubos-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - clubos-redis:/data

  # S3-compatible (fotos, logotipos) — volume persistente, sem licença.
  # Perfil `local`: nao arranca em `docker compose up` sem --profile (ex.: prod com R2).
  # Local/CI: pnpm docker:up ou COMPOSE_PROFILES=local / --profile local.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: clubos-garage
    profiles: ["local"]
    restart: unless-stopped
    command:
      [
        "/garage",
        "-c",
        "/etc/garage/garage.toml",
        "server",
        "--single-node",
        "--default-bucket",
      ]
    environment:
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-clubos}
      # Access key: "GK" + 30 hex. Secret: 64 hex.
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?Defina S3_ACCESS_KEY no .env}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?Defina S3_SECRET_KEY no .env}
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./docker/garage.toml:/etc/garage/garage.toml:ro
      - clubos-garage-meta:/var/lib/garage/meta
      - clubos-garage-data:/var/lib/garage/data

volumes:
  clubos-postgres:
  clubos-redis:
  clubos-garage-meta:
  clubos-garage-data:
