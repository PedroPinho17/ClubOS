# Infra local (Postgres, Redis, MinIO).
# Portas só em 127.0.0.1 — não expor à rede/LAN.
# Passwords: definir no .env (ver .env.example). Defaults abaixo são só para dev local.

services:
  postgres:
    image: postgres:16-alpine
    container_name: clubos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clubos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-clubos}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clubos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clubos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clubos-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - clubos-redis:/data

  # S3-compatible storage (files, fotos, documentos).
  # MinIO community saiu do Docker Hub / Quay anonimo; bitnamilegacy esta congelado.
  # adobe/s3mock e mantido e suficiente para local/CI. Em producao preferir R2/S3 gerido.
  minio:
    image: adobe/s3mock:3.12.0
    container_name: clubos-minio
    restart: unless-stopped
    environment:
      initialBuckets: ${S3_BUCKET:-clubos}
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ${S3_REGION:-eu-west-1}
    ports:
      # Host 9000 → API S3Mock 9090 (mantém S3_ENDPOINT=http://localhost:9000 no .env local)
      - "127.0.0.1:9000:9090"
    volumes:
      - clubos-minio:/tmp/s3mock

volumes:
  clubos-postgres:
  clubos-redis:
  clubos-minio:
