name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  NODE_VERSION: "22"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clubos
          POSTGRES_PASSWORD: clubos
          POSTGRES_DB: clubos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://clubos:clubos@localhost:5432/clubos?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      BETTER_AUTH_SECRET: ci-test-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_STANDALONE: "true"
      SEED_DEMO_PASSWORD: CiSeedPass1!
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high+)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build Database package
        run: pnpm --filter @clubos/database build

      - name: Build Shared package
        run: pnpm --filter @clubos/shared build

      - name: Deploy database migrations
        run: pnpm db:deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Typecheck API
        run: pnpm --filter @clubos/api typecheck

      - name: Typecheck Web
        run: pnpm --filter @clubos/web typecheck

      - name: Typecheck Mobile
        run: pnpm --filter @clubos/mobile typecheck

      - name: Lint API
        run: pnpm --filter @clubos/api lint

      - name: Lint Web (max-warnings 0)
        run: pnpm --filter @clubos/web lint

      - name: Mobile — fail without EXPO_PUBLIC_API_URL on EAS
        run: |
          set -e
          if EAS_BUILD=true EXPO_PUBLIC_API_URL= pnpm --filter @clubos/mobile check:eas-env; then
            echo "Expected check:eas-env to fail" >&2
            exit 1
          fi
          EAS_BUILD=true EXPO_PUBLIC_API_URL=https://api.example.com pnpm --filter @clubos/mobile check:eas-env

      - name: Build Web
        run: pnpm --filter @clubos/web build

      - name: Build API
        run: pnpm --filter @clubos/api build

      - name: Test API (unit + coverage >=80% common + E2E)
        run: pnpm --filter @clubos/api test

      - name: Test Web (unit)
        run: pnpm --filter @clubos/web test

      - name: Backup and restore (pg_dump / pg_restore)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          mkdir -p backups
          DUMP="backups/ci-clubos.dump"
          # libpq rejeita ?schema=public (só Prisma); strip query string
          PG_URL="${DATABASE_URL%%\?*}"
          pg_dump "$PG_URL" -Fc --no-owner --no-acl -f "$DUMP"
          test -s "$DUMP"
          pg_restore -d "$PG_URL" --clean --if-exists --no-owner --no-acl "$DUMP"
          COUNT=$(psql "$PG_URL" -tAc 'SELECT count(*) FROM "Organization"')
          test "${COUNT}" -ge 1
          echo "Backup/restore OK ($COUNT orgs)"

      - name: Install Playwright browsers
        run: pnpm --filter @clubos/web exec playwright install --with-deps chromium

      - name: E2E Web (Playwright)
        run: pnpm --filter @clubos/web test:e2e
        env:
          E2E_USER_EMAIL: admin@crcvale.pt
          E2E_USER_PASSWORD: ${{ env.SEED_DEMO_PASSWORD }}
          CI: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t clubos-api:ci .

      - name: Build Web image
        run: docker build -f Dockerfile.web -t clubos-web:ci .

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write CI .env for compose
        run: |
          printf '%s\n' \
            'POSTGRES_USER=clubos' \
            'POSTGRES_PASSWORD=CiComposePgPass32charsXX' \
            'POSTGRES_DB=clubos' \
            'DATABASE_URL=postgresql://clubos:CiComposePgPass32charsXX@postgres:5432/clubos?schema=public' \
            'REDIS_PASSWORD=CiComposeRedisPass32charsXX' \
            'REDIS_HOST=redis' \
            'REDIS_PORT=6379' \
            'S3_ACCESS_KEY=clubos' \
            'S3_SECRET_KEY=CiComposeMinioPass32charsXX' \
            'S3_ENDPOINT=http://minio:9000' \
            'S3_BUCKET=clubos' \
            'S3_FORCE_PATH_STYLE=true' \
            'BETTER_AUTH_SECRET=ci-compose-secret-with-at-least-32-chars' \
            'BETTER_AUTH_URL=http://localhost:4000' \
            'WEB_ORIGIN=http://localhost:3000' \
            'NEXT_PUBLIC_API_URL=same-origin' \
            'NODE_ENV=production' \
            'API_PORT=4000' \
            'SEED_DEMO_PASSWORD=CiSeedPass1!' \
            'RATE_LIMIT_STORE=memory' \
            > .env

      - name: Build and start stack
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.ci-smoke.yml \
            up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/api/health >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 3
          done
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.ci-smoke.yml \
            logs api web postgres redis || true
          exit 1

      - name: Seed demo users (NODE_ENV=development)
        run: |
          # Imagem de producao nao tem apps/api/src; seed:users usa dist via run-seed-users.mjs
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.ci-smoke.yml \
            exec -T -e NODE_ENV=development -e SEED_DEMO_PASSWORD=CiSeedPass1! api \
            sh -c 'cd /app && pnpm --filter @clubos/database seed && pnpm --filter @clubos/api seed:users'

      - name: Login smoke test
        run: |
          set -euo pipefail
          curl -sS -c /tmp/clubos-cookies.txt -X POST http://127.0.0.1:4000/api/auth/sign-in/email \
            -H 'content-type: application/json' \
            -d '{"email":"admin@crcvale.pt","password":"CiSeedPass1!"}' | tee /tmp/signin.json
          grep -q 'admin@crcvale.pt' /tmp/signin.json || grep -qi 'user' /tmp/signin.json
          curl -sf -b /tmp/clubos-cookies.txt http://127.0.0.1:4000/api/me/organizations >/dev/null
          echo "Login + /api/me/organizations OK"

      - name: Teardown
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.ci-smoke.yml \
            down -v
