name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  NODE_VERSION: "22"

jobs:
  # pnpm audit OOM (exit 134) mesmo com 8GB — usar scanner de lockfile leve.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency vuln scan (Trivy HIGH/CRITICAL)
        # Pin por commit SHA (v0.36.0) — tags Trivy foram sequestradas em mar/2026
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: node_modules,.git
          trivyignores: .trivyignore

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clubos
          POSTGRES_PASSWORD: clubos
          POSTGRES_DB: clubos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://clubos:clubos@localhost:5432/clubos?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      BETTER_AUTH_SECRET: ci-test-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_STANDALONE: "true"
      SEED_DEMO_PASSWORD: CiSeedPass1!
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build Database package
        run: pnpm --filter @clubos/database build

      - name: Build Shared package
        run: pnpm --filter @clubos/shared build

      - name: Deploy database migrations
        run: pnpm db:deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Typecheck API
        run: pnpm --filter @clubos/api typecheck

      - name: Typecheck Web
        run: pnpm --filter @clubos/web typecheck

      - name: Typecheck Mobile
        run: pnpm --filter @clubos/mobile typecheck

      - name: Lint API
        run: pnpm --filter @clubos/api lint

      - name: Lint Web (max-warnings 0)
        run: pnpm --filter @clubos/web lint

      - name: Mobile — fail without EXPO_PUBLIC_API_URL on EAS
        run: |
          set -e
          if EAS_BUILD=true EXPO_PUBLIC_API_URL= pnpm --filter @clubos/mobile check:eas-env; then
            echo "Expected check:eas-env to fail" >&2
            exit 1
          fi
          EAS_BUILD=true EXPO_PUBLIC_API_URL=https://api.example.com pnpm --filter @clubos/mobile check:eas-env

      - name: Test Mobile (Jest)
        run: pnpm --filter @clubos/mobile test

      - name: Build Web
        run: pnpm --filter @clubos/web build

      - name: Build API
        run: pnpm --filter @clubos/api build

      - name: Test API (unit + coverage gate + E2E)
        run: pnpm --filter @clubos/api test

      - name: Test Web (unit)
        run: pnpm --filter @clubos/web test

      - name: Backup and restore (pg_dump / pg_restore)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          mkdir -p backups
          DUMP="backups/ci-clubos.dump"
          # libpq rejeita ?schema=public (só Prisma); strip query string
          PG_URL="${DATABASE_URL%%\?*}"
          pg_dump "$PG_URL" -Fc --no-owner --no-acl -f "$DUMP"
          test -s "$DUMP"
          pg_restore -d "$PG_URL" --clean --if-exists --no-owner --no-acl "$DUMP"
          COUNT=$(psql "$PG_URL" -tAc 'SELECT count(*) FROM "Organization"')
          test "${COUNT}" -ge 1
          echo "Backup/restore OK ($COUNT orgs)"

      - name: Install Playwright browsers
        run: pnpm --filter @clubos/web exec playwright install --with-deps chromium

      - name: E2E Web (Playwright)
        run: pnpm --filter @clubos/web test:e2e
        env:
          E2E_USER_EMAIL: admin@crcvale.pt
          E2E_USER_PASSWORD: ${{ env.SEED_DEMO_PASSWORD }}
          CI: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t clubos-api:ci .

      - name: Build Web image
        run: docker build -f Dockerfile.web -t clubos-web:ci .

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write CI .env from .env.example
        run: |
          set -euo pipefail
          cp .env.example .env
          # Segredos CI (hosts do example: DATABASE_URL=@postgres — regressao localhost).
          # SMTP fake so a API em NODE_ENV=production arranca (MailService exige SMTP_HOST).
          python3 - <<'PY'
          from pathlib import Path
          repl = {
            "TrocaIstoPorPasswordPgForte32chars": "CiComposePgPass32charsXX",
            "TrocaIstoPorPasswordRedisForte32ch": "CiComposeRedisPass32charsXX",
            "troca-isto-por-um-segredo-forte-de-32+chars": "ci-compose-secret-with-at-least-32-chars",
            "altera-isto-no-teu-env-local": "CiSeedPass1!",
            'SMTP_HOST=': 'SMTP_HOST=smtp.example.invalid',
            'SMTP_USER=': 'SMTP_USER=ci',
            'SMTP_PASS=': 'SMTP_PASS=ci-not-used',
            'NODE_ENV=development': 'NODE_ENV=production',
            'NEXT_PUBLIC_API_URL="http://localhost:4000"': 'NEXT_PUBLIC_API_URL="same-origin"',
            'RATE_LIMIT_STORE=redis': 'RATE_LIMIT_STORE=memory',
            'BETTER_AUTH_URL="http://localhost:4000"': 'BETTER_AUTH_URL="http://localhost:4000"',
            'WEB_ORIGIN="http://localhost:3000"': 'WEB_ORIGIN="http://localhost:3000"',
          }
          text = Path(".env").read_text(encoding="utf-8")
          for a, b in repl.items():
            text = text.replace(a, b)
          # Garantir que o example ainda aponta a postgres (apanhar regressao localhost)
          if "@postgres:5432" not in text:
            raise SystemExit("DATABASE_URL no .env.example deve usar host postgres")
          if "@localhost:5432" in text.split("DATABASE_URL", 1)[-1].split("\n", 1)[0]:
            raise SystemExit("DATABASE_URL nao deve usar localhost no smoke (copia do example)")
          if "S3_ENDPOINT=\"http://garage:3900\"" not in text and "S3_ENDPOINT=http://garage:3900" not in text:
            raise SystemExit("S3_ENDPOINT no .env.example deve usar host garage:3900 para compose")
          Path(".env").write_text(text, encoding="utf-8")
          print("CI .env derived from .env.example OK")
          PY

      - name: Build and start stack
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.ci-smoke.yml \
            up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/api/health >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 3
          done
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.ci-smoke.yml \
            logs api web postgres redis garage || true
          exit 1

      - name: Seed demo users (NODE_ENV=development)
        run: |
          # exec nao corre o entrypoint: reconstruir DATABASE_URL a partir de POSTGRES_*
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.ci-smoke.yml \
            exec -T \
            -e NODE_ENV=development \
            -e SEED_DEMO_PASSWORD=CiSeedPass1! \
            api \
            sh -c '
              set -e
              ENCODED_USER=$(node -p "encodeURIComponent(process.env.POSTGRES_USER)")
              ENCODED_PW=$(node -p "encodeURIComponent(process.env.POSTGRES_PASSWORD)")
              export DATABASE_URL="postgresql://${ENCODED_USER}:${ENCODED_PW}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-clubos}?schema=public"
              cd /app
              pnpm --filter @clubos/database seed
              pnpm --filter @clubos/api seed:users
            '

      - name: Login smoke test
        run: |
          set -euo pipefail
          curl -sS -c /tmp/clubos-cookies.txt -X POST http://127.0.0.1:4000/api/auth/sign-in/email \
            -H 'content-type: application/json' \
            -d '{"email":"admin@crcvale.pt","password":"CiSeedPass1!"}' | tee /tmp/signin.json
          grep -q 'admin@crcvale.pt' /tmp/signin.json || grep -qi 'user' /tmp/signin.json
          curl -sf -b /tmp/clubos-cookies.txt http://127.0.0.1:4000/api/me/organizations >/dev/null
          echo "Login + /api/me/organizations OK"

      - name: Storage upload smoke (logo → Garage)
        run: |
          set -euo pipefail
          # PNG 1x1 — falha se S3/Garage estiver partido (ex.: AIStor sem license)
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' \
            | base64 -d > /tmp/clubos-logo.png
          curl -sS -b /tmp/clubos-cookies.txt -f \
            -F "file=@/tmp/clubos-logo.png;type=image/png" \
            http://127.0.0.1:4000/api/organization/logo | tee /tmp/logo-upload.json
          curl -sS -b /tmp/clubos-cookies.txt -f \
            -o /tmp/clubos-logo-out.png \
            http://127.0.0.1:4000/api/organization/logo
          test -s /tmp/clubos-logo-out.png
          echo "Logo upload + download OK ($(wc -c </tmp/clubos-logo-out.png) bytes)"

      - name: Teardown
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            -f docker-compose.ci-smoke.yml \
            down -v
