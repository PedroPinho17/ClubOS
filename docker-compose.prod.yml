# ClubOS — producao (Coolify / VPS)
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Antes do primeiro arranque:
#   1. Copiar .env.example para .env e preencher segredos de producao (passwords fortes)
#   2. Preferir Cloudflare R2 em S3_* (nao precisas do contentor garage)
#      Alternativa self-host: docker compose up -d postgres redis garage
#   3. pnpm db:deploy (primeiro arranque; NÃO correr db:seed em produção)
#
# DATABASE_URL: com POSTGRES_HOST o entrypoint remonta sempre o URL interno
# (ignora @localhost do .env). Password com encodeURIComponent.
#
# API/Web não publicam portas no host — o reverse proxy (Coolify/Traefik/Caddy)
# liga-se pela rede Docker interna.

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      POSTGRES_DB: ${POSTGRES_DB:-clubos}

  redis:
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD obrigatorio}",
      ]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: clubos-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: 4000
      # POSTGRES_HOST faz o entrypoint remontar DATABASE_URL (encode + host postgres).
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      POSTGRES_DB: ${POSTGRES_DB:-clubos}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD obrigatorio}
      # S3_ENDPOINT so do .env (Garage: http://garage:3900; R2: URL do Cloudflare).
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-same-origin}
    container_name: clubos-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - api
