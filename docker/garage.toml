# Config mínima Garage single-node (local / CI).
# Credenciais S3/bucket: GARAGE_DEFAULT_* no docker-compose.
# RPC secret: GARAGE_RPC_SECRET no .env (nao guardar no toml).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
api_bind_addr = "[::]:3900"
s3_region = "garage"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
