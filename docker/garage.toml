# Config mínima Garage single-node (local / CI).
# Credenciais e bucket: GARAGE_DEFAULT_* no docker-compose.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"
# 32 bytes em hex (64 chars) — obrigatorio; strings nao-hex fazem o Garage sair ao arranque
rpc_secret = "a1b2c3d4e5f60718293a4b5c6d7e8f90112233445566778899aabbccddeeff00"

[s3_api]
api_bind_addr = "[::]:3900"
s3_region = "garage"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
